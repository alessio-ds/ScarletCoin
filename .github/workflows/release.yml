name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the standalone executables
        run: python tools/build_release.py

      - name: Compile the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = Get-Content src\scarletcoin\__init__.py | Select-String '__version__ = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $installer = "$env:RUNNER_TEMP\innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $installer
            Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER" -Wait
          }
          & $iscc "/DMyAppVersion=$version" "packaging\windows\scarletcoin.iss"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scarletcoin-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
